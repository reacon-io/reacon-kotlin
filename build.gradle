group 'io.reacon'
version '3.0.0-beta.1'

wrapper {
    gradleVersion = '8.14.5'
    distributionUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-all.zip"
}

buildscript {
    ext.kotlin_version = '2.4.0'
    ext.spotless_version = "7.2.1"

    repositories {
        maven { url "https://repo1.maven.org/maven2" }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
        classpath "com.diffplug.spotless:spotless-plugin-gradle:$spotless_version"
    }
}

apply plugin: 'kotlin'
apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'com.diffplug.spotless'

repositories {
    maven { url "https://repo1.maven.org/maven2" }
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    // comment out below to run spotless as part of the `check` task
    enforceCheck false

    format 'misc', {
        // define the files (e.g. '*.gradle', '*.md') to apply `misc` to
        target '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        indentWithSpaces() // Takes an integer argument if you don't like 4
        endWithNewline()
    }
    kotlin {
        ktfmt()
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp-sse:5.4.0"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    api "com.fasterxml.jackson.module:jackson-module-kotlin:2.22.1"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1"
    api "com.squareup.okhttp3:okhttp:5.4.0"
    testImplementation "io.kotlintest:kotlintest-runner-junit5:3.4.2"
}

java {
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'io.reacon'
            artifactId = 'reacon-kotlin'
            version = '3.0.0-beta.1'
            from components.java
        }
    }
}

apply from: 'reacon-publishing.gradle'

tasks.named('jar') { from('LICENSE') { into 'META-INF' } }
publishing.publications.named('maven') {
    pom {
        name = 'Reacon Kotlin SDK'
        description = 'Official Reacon API client for Kotlin/JVM'
        url = 'https://github.com/reacon-io/reacon-kotlin'
        licenses { license { name = 'Apache-2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0.html'; distribution = 'repo' } }
        developers { developer { name = 'Reacon'; email = 'achazal@reacon.io'; organization = 'Reacon'; organizationUrl = 'https://github.com/reacon-io' } }
        scm { url = 'https://github.com/reacon-io/reacon-kotlin'; connection = 'scm:git:https://github.com/reacon-io/reacon-kotlin.git'; developerConnection = 'scm:git:ssh://git@github.com/reacon-io/reacon-kotlin.git' }
    }
}
